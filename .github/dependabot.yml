# Weekly npm dependency updates. Minor and patch bumps are grouped into one PR to reduce
# noise. Major bumps open as separate PRs so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
